{% extends 'base.html' %}

{% block title %}Profile settings{% endblock %}

{% block content %}
<section class="mx-auto max-w-4xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="mb-8">
    <p class="text-xs font-bold uppercase tracking-[0.24em] text-taupe/60">Profile</p>
    <h1 class="mt-4 text-4xl font-extrabold text-taupe">Update your details.</h1>
  </div>

  <div class="rounded-[32px] border border-taupe/10 bg-white/80 p-8 shadow-soft">
    <form method="post" class="grid gap-6 md:grid-cols-2">
      {% csrf_token %}
      {% for field in form %}
        <div class="{% if field.name == 'notes' or field.name == 'preferred_services' %}md:col-span-2{% endif %}">
          <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-bold text-taupe">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="mt-2 text-sm text-red-600">{{ field.errors|join:', ' }}</div>{% endif %}
        </div>
      {% endfor %}
      <div class="md:col-span-2 flex justify-end">
        <button type="submit" class="rounded-full bg-terracotta px-6 py-3 text-sm font-bold text-white shadow-soft transition hover:bg-clay">Save changes</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
